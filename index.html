  </head>

  <body>
    <div id="root"></div>
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser history using window.history.replaceState(...),
      // which won cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser history for
      // the single page app to route accordingly.
      (function(l) {
        if (l.search[1] === "/" ) {
          var decoded = l.search.slice(1).split("&").map(function(s) { 
            return s.replace(/~and~/g, "&")
          }).join("?");
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <form name="enquiry" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <button type="submit">Send</button>
    </form>
  </body>
